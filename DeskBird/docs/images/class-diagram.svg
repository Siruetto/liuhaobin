<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A3A22"/>
    </marker>
    <marker id="dia" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,5 L5,0 L10,5 L5,10 z" fill="#5A3A22"/>
    </marker>
  </defs>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">

    <g stroke="#E89A5F" stroke-width="1.5" fill="#FFF7EF">
      <rect x="20" y="30" width="190" height="152"/>
      <rect x="20" y="200" width="190" height="112"/>
      <rect x="20" y="350" width="190" height="72"/>
      <rect x="260" y="30" width="190" height="52"/>
      <rect x="260" y="160" width="190" height="132"/>
      <rect x="260" y="330" width="190" height="112"/>
      <rect x="500" y="30" width="190" height="92"/>
      <rect x="500" y="170" width="190" height="52"/>
      <rect x="500" y="280" width="190" height="72"/>
      <rect x="500" y="400" width="190" height="72"/>
    </g>

    <g fill="#FF8C42" stroke="#E89A5F" stroke-width="1.5">
      <rect x="20" y="30" width="190" height="32"/>
      <rect x="20" y="200" width="190" height="32"/>
      <rect x="20" y="350" width="190" height="32"/>
      <rect x="260" y="30" width="190" height="32"/>
      <rect x="260" y="160" width="190" height="32"/>
      <rect x="260" y="330" width="190" height="32"/>
      <rect x="500" y="30" width="190" height="32"/>
      <rect x="500" y="170" width="190" height="32"/>
      <rect x="500" y="280" width="190" height="32"/>
      <rect x="500" y="400" width="190" height="32"/>
    </g>

    <g fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">
      <text x="115" y="46" dominant-baseline="central">Agent</text>
      <text x="115" y="216" dominant-baseline="central">Memory</text>
      <text x="115" y="366" dominant-baseline="central">WebServer</text>
      <text x="355" y="46" dominant-baseline="central">Planner</text>
      <text x="355" y="176" dominant-baseline="central">Scheduler</text>
      <text x="355" y="346" dominant-baseline="central">ReminderStore</text>
      <text x="595" y="46" dominant-baseline="central">ToolBox</text>
      <text x="595" y="186" dominant-baseline="central">Tool</text>
      <text x="595" y="296" dominant-baseline="central">VoiceClient</text>
      <text x="595" y="416" dominant-baseline="central">DeviceClient</text>
    </g>

    <g fill="#5A3A22" font-size="12.5">
      <text x="30" y="78">- planner: Planner</text>
      <text x="30" y="98">- toolbox: ToolBox</text>
      <text x="30" y="118">- memory: Memory</text>
      <text x="30" y="138">- scheduler: Scheduler</text>
      <text x="30" y="168">+ chat(text): str</text>
      <text x="30" y="188">+ handle_voice(audio): str</text>

      <text x="30" y="248">- turns: list</text>
      <text x="30" y="268">- facts: dict</text>
      <text x="30" y="298">+ add(role, text)</text>
      <text x="30" y="318">+ remember()</text>

      <text x="30" y="398">- agent: Agent</text>
      <text x="30" y="428">+ start()</text>

      <text x="270" y="78">+ respond(text, history): str</text>

      <text x="270" y="208">- store: ReminderStore</text>
      <text x="270" y="228">- voice: VoiceClient</text>
      <text x="270" y="258">+ add_reminder()</text>
      <text x="270" y="278">+ check_due()</text>
      <text x="270" y="298">+ tick()</text>

      <text x="270" y="378">- db: sqlite3.Connection</text>
      <text x="270" y="408">+ add()</text>
      <text x="270" y="428">+ list()</text>
      <text x="270" y="448">+ mark_done()</text>

      <text x="510" y="78">- tools: dict[str, Tool]</text>
      <text x="510" y="108">+ call(name, args)</text>
      <text x="510" y="128">+ schemas()</text>

      <text x="510" y="218">+ name, + schema, + handler</text>

      <text x="510" y="328">+ asr(audio): str</text>
      <text x="510" y="348">+ tts(text): audio</text>

      <text x="510" y="448">+ push(text)</text>
      <text x="510" y="468">+ on_event(cb)</text>
    </g>

    <g stroke="#5A3A22" stroke-width="1.6" fill="none">
      <line x1="355" y1="82" x2="355" y2="96" stroke-dasharray="4,3"/>
      <line x1="210" y1="90" x2="260" y2="56" marker-end="url(#arrow)"/>
      <line x1="210" y1="120" x2="500" y2="76" marker-end="url(#arrow)"/>
      <line x1="115" y1="182" x2="115" y2="200" marker-end="url(#arrow)"/>
      <line x1="210" y1="140" x2="260" y2="216" marker-end="url(#arrow)"/>
      <polyline points="20,386 10,386 10,106 20,106" marker-end="url(#arrow)"/>
      <line x1="595" y1="122" x2="595" y2="170" marker-start="url(#dia)"/>
      <line x1="355" y1="292" x2="355" y2="330" marker-end="url(#arrow)"/>
      <line x1="450" y1="210" x2="500" y2="316" marker-end="url(#arrow)"/>
      <line x1="450" y1="250" x2="500" y2="436" marker-end="url(#arrow)"/>
    </g>

    <rect x="260" y="96" width="190" height="40" fill="#FFFFFF" stroke="#E89A5F" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="355" y="116" fill="#5A3A22" font-size="12" text-anchor="middle" dominant-baseline="central">实现：LLMPlanner / OfflinePlanner</text>

    <g fill="#5A3A22" font-size="12">
      <text x="420" y="214">播报</text>
      <text x="420" y="258">推送</text>
    </g>
  </g>
</svg>
